spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

# No defaults on purpose: startup fails fast if the secret is not supplied.
app.security.secret-key=${JWT_SECRET}
app.security.jwt-expiration=${JWT_EXPIRATION:10800000}
allowed.origins=${ALLOWED_ORIGINS}
app.booking.max-days-ahead=${BOOKING_MAX_DAYS_AHEAD:60}

# Swagger UI is normally not exposed in production
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
