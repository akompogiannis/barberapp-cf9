# Database settings
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:barberapp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:barberuser}
spring.datasource.password=${MYSQL_PASSWORD:12345}

# Schema is owned by Flyway. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Dev-only secret. In prod this MUST come from the environment.
app.security.secret-key=${JWT_SECRET:QAvIUJMhYX0NeW2BvjuzaiU23MXAOHX5OGNwLFiPmJo3m7qNz92kFjYBVQwDo0sk}
app.security.jwt-expiration=10800000

# Forces explicit JOIN FETCH / @EntityGraph instead of lazy loading in the view
spring.jpa.open-in-view=false

# The Vite dev server
allowed.origins=http://localhost:5173,http://localhost:3000

# How far ahead a customer may book
app.booking.max-days-ahead=60
