spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:barberapp_staging}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

app.security.secret-key=${JWT_SECRET}
app.security.jwt-expiration=10800000
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.booking.max-days-ahead=60
